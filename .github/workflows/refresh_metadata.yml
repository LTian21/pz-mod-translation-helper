name: 🔄 手动刷新模组元数据

on:
  workflow_dispatch:

jobs:
  refresh:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Get IDs
        id: ids
        run: |
          MOD_IDS=$(grep -oE '[0-9]+' id_list.txt | sort -u | jq -Rsc 'split("\n") | map(select(. != ""))')
          echo "ids=$MOD_IDS" >> $GITHUB_OUTPUT

      - name: Steam API Batch Fetch
        env:
          STEAM_API_KEY: ${{ secrets.STEAM_API_KEY }}
        run: |
          MOD_IDS_JSON='${{ steps.ids.outputs.ids }}'
          MAP_FILE="translation_utils/mod_id_name_map.json"
          POST_DATA=$(echo "$MOD_IDS_JSON" | jq -r 'to_entries[] | "publishedfileids[\(.key)]=\(.value)"' | paste -sd '&')
          ITEM_COUNT=$(echo "$MOD_IDS_JSON" | jq 'length')
          
          # 一次性获取所有信息
          API_RESPONSE=$(curl -s -X POST "https://api.steampowered.com/ISteamRemoteStorage/GetPublishedFileDetails/v1/" \
            -d "itemcount=$ITEM_COUNT" -d "$POST_DATA")
          
          NEW_CHUNK=$(echo "$API_RESPONSE" | jq '.response.publishedfiledetails | map(
            if .result == 1 then {
              (.publishedfileid): {
                "name": (.title // "未知Mod"),
                "subscriptions": ((.subscriptions // 0) | tonumber),
                "created_at": ((.time_created // 0) | tonumber),
                "updated_at": ((.time_updated // 0) | tonumber),
                "views": ((.views // 0) | tonumber),
                "favorited": ((.favorited // 0) | tonumber)
              }
            } else {(.publishedfileid): null} end) | add')

          mkdir -p translation_utils
          [ ! -f "$MAP_FILE" ] && echo "{}" > "$MAP_FILE"
          jq -s '.[0] * .[1] | to_entries | sort_by(.key | tonumber) | from_entries' "$MAP_FILE" <(echo "$NEW_CHUNK") > tmp.json && mv tmp.json "$MAP_FILE"

      - name: Commit
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: 手动全量同步模组元数据统计"
          file_pattern: 'translation_utils/mod_id_name_map.json'